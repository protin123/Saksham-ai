<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saksham ai</title>

<style>
  :root {
    --bg: #1c1e1f;
    --panel: #202224;
    --surface: #292c2e;
    --surface-2: #313436;
    --border: #3a3d3f;
    --accent: #e2a63b;
    --accent-strong: #f0b94f;
    --accent-soft: rgba(226, 166, 59, 0.16);
    --assistant-bubble: #24322f;
    --assistant-border: #3a5049;
    --user-bubble: #2f3234;
    --text: #ece7de;
    --text-muted: #94989a;
    --danger: #c1584a;
    --danger-soft: rgba(193, 88, 74, 0.16);
    --radius-sm: 5px;
    --radius-md: 9px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--surface-2);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    font-family: inherit;
  }

  .app {
    display: grid;
    grid-template-columns: 272px 1fr;
    height: 100vh;
  }

  /* =========================================================
     SIDEBAR
  ========================================================= */

  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    gap: 14px;
    overflow: hidden;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 4px;
  }

  .brand-mark {
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-mark svg {
    display: block;
  }

  .brand-name {
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 0.01em;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }

  .new-chat-btn:hover {
    border-color: var(--accent);
    background: var(--surface-2);
  }

  .new-chat-btn svg {
    color: var(--accent);
    flex-shrink: 0;
  }

  .history-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 6px;
  }

  .history-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0;
    padding: 0;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 6px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border-left: 2px solid transparent;
  }

  .history-item:hover {
    background: var(--surface);
  }

  .history-item.active {
    background: var(--surface);
    border-left-color: var(--accent);
  }

  .history-index {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .history-title {
    flex: 1;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .history-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    visibility: hidden;
    flex-shrink: 0;
  }

  .history-item:hover .history-delete {
    visibility: visible;
  }

  .history-delete:hover {
    color: var(--danger);
  }

  .clear-history-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    padding: 6px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }

  .clear-history-btn:hover {
    color: var(--text);
  }

  .sidebar-backdrop {
    display: none;
  }

  .sidebar-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    cursor: pointer;
  }

  /* =========================================================
     MAIN
  ========================================================= */

  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 24px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .chat-title-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .chat-title {
    font-size: 14.5px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .provider-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .empty-state {
    margin: auto;
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
    max-width: 320px;
    line-height: 1.6;
  }

  .bubble-row {
    display: flex;
  }

  .bubble-row.user {
    justify-content: flex-end;
  }

  .bubble-row.assistant,
  .bubble-row.error {
    justify-content: flex-start;
  }

  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 14px;
    line-height: 1.55;
    border: 1px solid transparent;
  }

  .bubble-row.user .bubble {
    background: var(--user-bubble);
    border-color: var(--border);
    border-bottom-right-radius: 2px;
  }

  .bubble-row.assistant .bubble {
    background: var(--assistant-bubble);
    border-color: var(--assistant-border);
    border-bottom-left-radius: 2px;
  }

  .bubble-row.error .bubble {
    background: var(--danger-soft);
    border-color: var(--danger);
  }

  .bubble-text {
    word-wrap: break-word;
  }

  .bubble-text code {
    font-family: var(--font-mono);
    background: rgba(255, 255, 255, 0.07);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.9em;
  }

  .bubble-text pre {
    font-family: var(--font-mono);
    background: rgba(0, 0, 0, 0.25);
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 6px 0;
    font-size: 0.85em;
  }

  .bubble-text pre code {
    background: none;
    padding: 0;
  }

  .bubble-time {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .attachment-chip {
    margin-bottom: 8px;
  }

  .attachment-chip.image img {
    max-width: 220px;
    max-height: 220px;
    border-radius: 6px;
    display: block;
  }

  .attachment-chip.file {
    font-size: 12px;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 9px;
    border-radius: 6px;
    display: inline-block;
  }

  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: pulse 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) {
    animation-delay: .2s;
  }

  .typing span:nth-child(3) {
    animation-delay: .4s;
  }

  @keyframes pulse {
    0%, 80%, 100% {
      opacity: .3;
      transform: scale(0.8);
    }

    40% {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* =========================================================
     INPUT
  ========================================================= */

  .input-strip {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel);

    /*
      FIX:
      Attachment preview gets its own full-width row.
      Text input remains available for typing.
    */
    flex-wrap: wrap;
  }

  .attachment-preview {
    /*
      FIX:
      Always occupy one complete row.
    */
    flex: 0 0 100%;
    width: 100%;
    min-width: 0;
    order: -1;
  }

  .attachment-preview-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 0;
    max-width: 100%;
  }

  .attachment-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }

  .attachment-remove:hover {
    color: var(--danger);
  }

  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color .15s ease, color .15s ease;
  }

  .icon-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .icon-btn.mic-btn.listening {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
    animation: mic-pulse 1.1s infinite;
  }

  @keyframes mic-pulse {
    0% {
      box-shadow: 0 0 0 0 var(--accent-soft);
    }

    100% {
      box-shadow: 0 0 0 8px rgba(226, 166, 59, 0);
    }
  }

  .icon-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  .icon-btn:disabled:hover {
    color: var(--text-muted);
    border-color: var(--border);
  }

  #textInput {
    flex: 1;
    resize: none;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-family: var(--font-sans);
    font-size: 14px;
    max-height: 160px;
    line-height: 1.4;
    min-width: 0;
  }

  #textInput::placeholder {
    color: var(--text-muted);
  }

  #textInput:focus {
    border-color: var(--accent);
  }

  .send-btn {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #1c1e1f;
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s ease;
  }

  .send-btn:hover {
    background: var(--accent-strong);
  }

  .send-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .status-line {
    min-height: 18px;
    padding: 0 24px 10px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  /* =========================================================
     HELPLINE CARDS
  ========================================================= */

  .helpline-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }

  .helpline-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid var(--border);
    border-radius: 7px;
  }

  .helpline-info {
    min-width: 0;
  }

  .helpline-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 3px;
  }

  .helpline-description {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .helpline-number {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    margin-top: 4px;
  }

  .helpline-call {
    flex-shrink: 0;
    text-decoration: none;
    background: var(--accent);
    color: #1c1e1f;
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
  }

  .helpline-call:hover {
    background: var(--accent-strong);
  }

  @media (prefers-reduced-motion: reduce) {
    .typing span,
    .icon-btn.mic-btn.listening {
      animation: none !important;
    }
  }

  @media (max-width: 760px) {
    .app {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 264px;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: 0 0 24px rgba(0,0,0,0.4);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 15;
    }

    .sidebar-backdrop.show {
      display: block;
    }

    .sidebar-toggle {
      display: flex;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 25;
    }

    .chat-header {
      padding-left: 60px;
    }

    .bubble {
      max-width: 86%;
    }
  }

  @media (max-width: 600px) {
    .helpline-card {
      align-items: flex-start;
      flex-direction: column;
    }

    .helpline-call {
      width: 100%;
      text-align: center;
    }

    .input-strip {
      padding: 12px 14px;
    }
  }
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <!-- =====================================================
           SAKSHAM MITRA ROBOT LOGO
           Robot only - no speech bubble
      ====================================================== -->

      <span class="brand-mark" aria-hidden="true">

        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none">

          <!-- Robot head -->
          <rect
            x="5"
            y="7"
            width="14"
            height="12"
            rx="3"
            stroke="currentColor"
            stroke-width="1.6"/>

          <!-- Antenna -->
          <path
            d="M12 7V4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"/>

          <circle
            cx="12"
            cy="3"
            r="1"
            fill="currentColor"/>

          <!-- Eyes -->
          <circle
            cx="9.5"
            cy="12"
            r="1.1"
            fill="currentColor"/>

          <circle
            cx="14.5"
            cy="12"
            r="1.1"
            fill="currentColor"/>

          <!-- Smile -->
          <path
            d="M9 15
               C10.5 16.4
               13.5 16.4
               15 15"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"/>

          <!-- Side ears -->
          <path
            d="M5 11H3.5M19 11H20.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="brand-name">
        Saksham Mitra
      </span>

    </div>

    <button
      class="new-chat-btn"
      id="newChatBtn"
      type="button">

      <svg
        width="15"
        height="15"
        viewBox="0 0 16 16"
        fill="none">

        <path
          d="M8 3v10M3 8h10"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"/>

      </svg>

      New chat

    </button>

    <div class="history-label">
      History
    </div>

    <ul
      class="history-list"
      id="historyList"
      aria-label="Conversation history">
    </ul>

    <button
      class="clear-history-btn"
      id="clearHistoryBtn"
      type="button">

      Clear all history

    </button>

  </aside>

  <div
    class="sidebar-backdrop"
    id="sidebarBackdrop">
  </div>

  <button
    class="sidebar-toggle"
    id="sidebarToggle"
    type="button"
    aria-label="Toggle history panel">

    <svg
      width="17"
      height="17"
      viewBox="0 0 24 24"
      fill="none">

      <path
        d="M3 6h18M3 12h18M3 18h18"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"/>

    </svg>

  </button>

  <main class="main">

    <header class="chat-header">

      <div class="chat-title-group">

        <div
          class="chat-title"
          id="chatTitle">

          New chat

        </div>

        <span
          class="provider-badge"
          id="providerBadge">

          …

        </span>

      </div>

    </header>

    <div
      class="messages"
      id="messages"
      role="log"
      aria-live="polite"
      aria-label="Conversation">
    </div>

    <form
      class="input-strip"
      id="inputForm">

      <!-- Attachment preview -->
      <div
        class="attachment-preview"
        id="attachmentPreview"
        hidden>
      </div>

      <input
        type="file"
        id="fileInput"
        hidden
        accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.log,.xml,.yaml,.yml"
      />

      <!-- Attach -->
      <button
        type="button"
        class="icon-btn"
        id="attachBtn"
        title="Attach a file"
        aria-label="Attach a file">

        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true">

          <path
            d="M21 11.5
               L11.81 20.69
               A5 5 0 0 1 4.74 13.62
               L13.93 4.43
               A3.5 3.5 0 0 1 18.88 9.38
               L9.69 18.57
               A2 2 0 0 1 6.86 15.74
               L15.35 7.25"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </button>

      <!-- Mic -->
      <button
        type="button"
        class="icon-btn mic-btn"
        id="micBtn"
        title="Speak your message"
        aria-label="Speak your message">

        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z"
            stroke="currentColor"
            stroke-width="1.4"/>

          <path
            d="M19 11a7 7 0 01-14 0M12 18v3"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"/>

        </svg>

      </button>

      <!-- Text input -->
      <textarea
        id="textInput"
        rows="1"
        placeholder="Ask anything…"
        aria-label="Message">
      </textarea>

      <!-- Send -->
      <button
        type="submit"
        class="send-btn"
        id="sendBtn"
        aria-label="Send message">

        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="M4 12L20 4L13 20L11 13L4 12Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"/>

        </svg>

      </button>

    </form>

    <div
      class="status-line"
      id="statusLine"
      aria-live="polite">
    </div>

  </main>

</div>

<script>
(function () {

  "use strict";

  const STORAGE_KEY = "chat-data";

  const TEXT_EXTS = [
    "txt",
    "md",
    "csv",
    "json",
    "js",
    "ts",
    "py",
    "html",
    "css",
    "log",
    "xml",
    "yaml",
    "yml"
  ];

  const MAX_FILE_BYTES =
    4 * 1024 * 1024;

  const MAX_TEXT_CHARS =
    6000;

  const state = {
    conversations: {},
    order: [],
    currentId: null
  };

  let pendingAttachment = null;

  let recognition = null;

  let recognizing = false;

  const els = {

    sidebar:
      document.getElementById("sidebar"),

    sidebarBackdrop:
      document.getElementById("sidebarBackdrop"),

    sidebarToggle:
      document.getElementById("sidebarToggle"),

    newChatBtn:
      document.getElementById("newChatBtn"),

    historyList:
      document.getElementById("historyList"),

    clearHistoryBtn:
      document.getElementById("clearHistoryBtn"),

    chatTitle:
      document.getElementById("chatTitle"),

    providerBadge:
      document.getElementById("providerBadge"),

    messages:
      document.getElementById("messages"),

    inputForm:
      document.getElementById("inputForm"),

    attachmentPreview:
      document.getElementById("attachmentPreview"),

    fileInput:
      document.getElementById("fileInput"),

    attachBtn:
      document.getElementById("attachBtn"),

    micBtn:
      document.getElementById("micBtn"),

    textInput:
      document.getElementById("textInput"),

    sendBtn:
      document.getElementById("sendBtn"),

    statusLine:
      document.getElementById("statusLine")

  };

  init();


  /* =========================================================
     INITIALIZATION
  ========================================================= */

  async function init() {

    await loadState();

    if (!state.order.length) {

      createConversation();

    } else if (
      !state.currentId ||
      !state.conversations[state.currentId]
    ) {

      state.currentId =
        state.order[0];

    }

    renderHistory();

    renderMessages();

    setupSpeech();

    bindEvents();

    loadProviderBadge();

  }


  /* =========================================================
     PROVIDER
  ========================================================= */

  async function loadProviderBadge() {

    try {

      const res =
        await fetch(
          "/api/provider"
        );

      const data =
        await res.json();

      els.providerBadge.textContent =
        data.label ||
        (
          data.provider === "unknown"
            ? "Unknown key"
            : "No key set"
        );

    } catch (e) {

      els.providerBadge.textContent =
        "Offline";

    }

  }


  /* =========================================================
     LOCAL STORAGE
  ========================================================= */

  async function loadState() {

    try {

      const res =
        await window.storage.get(
          STORAGE_KEY,
          false
        );

      if (
        res &&
        res.value
      ) {

        const parsed =
          JSON.parse(res.value);

        state.conversations =
          parsed.conversations || {};

        state.order =
          parsed.order ||
          Object.keys(
            state.conversations
          );

        state.currentId =
          parsed.currentId || null;

      }

    } catch (e) {

      // Start fresh.

    }

  }


  async function saveState() {

    try {

      await window.storage.set(
        STORAGE_KEY,
        JSON.stringify({

          conversations:
            state.conversations,

          order:
            state.order,

          currentId:
            state.currentId

        }),
        false
      );

    } catch (e) {

      setStatus(
        "This session's history couldn't be saved."
      );

    }

  }


  /* =========================================================
     CONVERSATIONS
  ========================================================= */

  function createConversation() {

    const id =
      "c_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2, 7);

    state.conversations[id] = {

      id: id,

      title:
        "New chat",

      messages: [],

      createdAt:
        Date.now()

    };

    state.order.unshift(id);

    state.currentId =
      id;

    saveState();

    return id;

  }


  function getCurrent() {

    return state.conversations[
      state.currentId
    ];

  }


  function deleteConversation(id) {

    delete state.conversations[id];

    state.order =
      state.order.filter(
        function (x) {
          return x !== id;
        }
      );

    if (
      state.currentId === id
    ) {

      state.currentId =
        state.order[0] ||
        null;

      if (!state.currentId) {

        createConversation();

      }

    }

    saveState();

    renderHistory();

    renderMessages();

  }


  /* =========================================================
     HISTORY UI
  ========================================================= */

  function renderHistory() {

    els.historyList.innerHTML =
      "";

    state.order.forEach(
      function (id, idx) {

        const conv =
          state.conversations[id];

        if (!conv) return;

        const li =
          document.createElement("li");

        li.className =
          "history-item" +
          (
            id === state.currentId
              ? " active"
              : ""
          );

        li.dataset.id =
          id;

        li.innerHTML =

          '<span class="history-index">' +
          String(idx + 1).padStart(3, "0") +
          "</span>" +

          '<span class="history-title">' +
          escapeHtml(
            conv.title ||
            "New chat"
          ) +
          "</span>" +

          '<button class="history-delete" ' +
          'data-id="' +
          id +
          '" ' +
          'type="button" ' +
          'aria-label="Delete this conversation">' +
          "×" +
          "</button>";

        els.historyList.appendChild(
          li
        );

      }
    );

  }


  /* =========================================================
     MESSAGE RENDERING
  ========================================================= */

  function renderMessages() {

    const conv =
      getCurrent();

    els.chatTitle.textContent =
      (
        conv &&
        conv.title
      ) ||
      "New chat";

    els.messages.innerHTML =
      "";

    if (
      !conv ||
      conv.messages.length === 0
    ) {

      const empty =
        document.createElement("div");

      empty.className =
        "empty-state";

      empty.innerHTML =
        "<p>Ask a question, attach a file, or tap the mic to speak.</p>";

      els.messages.appendChild(
        empty
      );

      return;

    }

    conv.messages.forEach(
      function (m) {

        els.messages.appendChild(
          buildBubble(m)
        );

      }
    );

    els.messages.scrollTop =
      els.messages.scrollHeight;

  }


  function buildBubble(m) {

    const wrap =
      document.createElement("div");

    wrap.className =
      "bubble-row " +
      m.role;

    let attachmentHtml =
      "";

    if (m.attachment) {

      if (
        m.attachment.kind === "image" &&
        m.attachment.data
      ) {

        attachmentHtml =
          '<div class="attachment-chip image">' +
          '<img src="' +
          m.attachment.data +
          '" alt="' +
          escapeHtml(
            m.attachment.name
          ) +
          '"/>' +
          "</div>";

      } else {

        attachmentHtml =
          '<div class="attachment-chip file">' +
          "📄 " +
          escapeHtml(
            m.attachment.name ||
            "Attached file"
          ) +
          "</div>";

      }

    }

    const bodyHtml =
      m.role === "error"
        ? escapeHtml(m.text)
        : renderMarkdownLite(
            m.text || ""
          );

    let helplineHtml =
      "";

    if (
      m.helplines &&
      Array.isArray(m.helplines)
    ) {

      helplineHtml = `
        <div class="helpline-list">
          ${m.helplines.map(
            function (h) {

              return `
                <div class="helpline-card">

                  <div class="helpline-info">

                    <div class="helpline-name">
                      ${escapeHtml(h.name)}
                    </div>

                    <div class="helpline-description">
                      ${escapeHtml(h.description)}
                    </div>

                    <div class="helpline-number">
                      ${escapeHtml(h.number)}
                    </div>

                  </div>

                  <a
                    class="helpline-call"
                    href="tel:${escapeHtml(h.number)}"
                  >
                    📞 Call Now
                  </a>

                </div>
              `;

            }
          ).join("")}
        </div>
      `;

    }

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.innerHTML =

      attachmentHtml +

      (
        m.text
          ? '<div class="bubble-text">' +
            bodyHtml +
            "</div>"
          : ""
      ) +

      helplineHtml +

      '<div class="bubble-time">' +
      formatTime(m.time) +
      "</div>";

    wrap.appendChild(
      bubble
    );

    return wrap;

  }


  function escapeHtml(str) {

    return (str || "").replace(
      /[&<>"']/g,
      function (c) {

        return ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[c];

      }
    );

  }


  function renderMarkdownLite(text) {

    let t =
      escapeHtml(text);

    t =
      t.replace(
        /```([\s\S]*?)```/g,
        function (_, code) {

          return (
            "<pre><code>" +
            code.trim() +
            "</code></pre>"
          );

        }
      );

    t =
      t.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
      );

    t =
      t.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
      );

    t =
      t.replace(
        /\n/g,
        "<br>"
      );

    return t;

  }


  function formatTime(ts) {

    if (!ts) return "";

    return new Date(ts)
      .toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

  }


  /* =========================================================
     STATUS
  ========================================================= */

  let statusTimer =
    null;

  function setStatus(
    msg,
    timeout
  ) {

    els.statusLine.textContent =
      msg;

    clearTimeout(statusTimer);

    if (timeout !== 0) {

      statusTimer =
        setTimeout(
          function () {

            els.statusLine.textContent =
              "";

          },
          timeout || 4000
        );

    }

  }


  /* =========================================================
     TEXT AREA
  ========================================================= */

  function autoResize() {

    els.textInput.style.height =
      "auto";

    els.textInput.style.height =
      Math.min(
        els.textInput.scrollHeight,
        160
      ) +

  /* =========================================================
     ATTACHMENT PREVIEW
  ========================================================= */

  function showAttachmentPreview() {

    /*
      Text input must always remain usable.
    */

    els.textInput.disabled =
      false;

    els.textInput.readOnly =
      false;


    if (!pendingAttachment) {

      els.attachmentPreview.hidden =
        true;

      els.attachmentPreview.innerHTML =
        "";

      return;

    }


    els.attachmentPreview.hidden =
      false;


    const icon =
      pendingAttachment.kind === "image"
        ? "🖼️"
        : "📄";


    els.attachmentPreview.innerHTML =

      '<span class="attachment-preview-chip">' +

      icon +

      " " +

      "<span>" +

      escapeHtml(
        pendingAttachment.name ||
        "Attachment"
      ) +

      "</span>" +

      '<button type="button" ' +
      'class="attachment-remove" ' +
      'aria-label="Remove attachment">' +

      "×" +

      "</button>" +

      "</span>";


    const removeButton =
      els.attachmentPreview.querySelector(
        ".attachment-remove"
      );


    if (removeButton) {

      removeButton.addEventListener(
        "click",
        function () {

          pendingAttachment =
            null;

          showAttachmentPreview();

          els.textInput.disabled =
            false;

          els.textInput.readOnly =
            false;

          els.textInput.focus();

        }
      );

    }

  }


  /* =========================================================
     FILE SELECTION
  ========================================================= */

  function handleFileSelect(e) {

    const file =
      e.target.files[0];

    els.fileInput.value =
      "";

    if (!file) return;


    if (
      file.size >
      MAX_FILE_BYTES
    ) {

      setStatus(
        "That file is too large to attach (max 4 MB)."
      );

      return;

    }


    const ext =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    /* IMAGE */

    if (
      file.type.indexOf(
        "image/"
      ) === 0
    ) {

      const reader =
        new FileReader();

      reader.onload =
        function () {

          pendingAttachment = {

            kind:
              "image",

            name:
              file.name,

            mediaType:
              file.type,

            data:
              reader.result

          };

          showAttachmentPreview();

        };

      reader.onerror =
        function () {

          setStatus(
            "Couldn't read that image."
          );

        };

      reader.readAsDataURL(file);

      return;

    }


    /* TEXT */

    if (
      TEXT_EXTS.indexOf(ext) !== -1
    ) {

      const reader =
        new FileReader();

      reader.onload =
        function () {

          let text =
            String(
              reader.result
            );

          let truncated =
            false;


          if (
            text.length >
            MAX_TEXT_CHARS
          ) {

            text =
              text.slice(
                0,
                MAX_TEXT_CHARS
              );

            truncated =
              true;

          }


          pendingAttachment = {

            kind:
              "text",

            name:
              file.name,

            mediaType:
              file.type ||
              "text/plain",

            text:
              text,

            truncated:
              truncated

          };

          showAttachmentPreview();

        };


      reader.onerror =
        function () {

          setStatus(
            "Couldn't read that file."
          );

        };


      reader.readAsText(file);

      return;

    }


    /* UNSUPPORTED */

    pendingAttachment = {

      kind:
        "unsupported",

      name:
        file.name,

      mediaType:
        file.type ||
        null

    };

    showAttachmentPreview();

    setStatus(
      "That file can be attached, but its contents won't be read."
    );

  }


  /* =========================================================
     SPEECH
  ========================================================= */

  function setupSpeech() {

    const SR =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SR) {

      els.micBtn.disabled =
        true;

      els.micBtn.title =
        "Voice input isn't supported in this browser";

      return;

    }


    recognition =
      new SR();

    recognition.continuous =
      false;

    recognition.interimResults =
      true;

    recognition.lang =
      "en-US";


    recognition.onstart =
      function () {

        recognizing =
          true;

        els.micBtn.classList.add(
          "listening"
        );

        setStatus(
          "Listening…",
          0
        );

      };


    recognition.onresult =
      function (event) {

        let transcript =
          "";

        for (
          let i =
            event.resultIndex;

          i <
          event.results.length;

          i++
        ) {

          transcript +=
            event.results[i][0]
              .transcript;

        }

        els.textInput.value =
          transcript;

        autoResize();

      };


    recognition.onerror =
      function (event) {

        if (
          event.error ===
            "not-allowed" ||
          event.error ===
            "service-not-allowed"
        ) {

          setStatus(
            "Microphone access was denied or isn't available here."
          );

        } else if (
          event.error ===
          "no-speech"
        ) {

          setStatus(
            "Didn't catch that — try again."
          );

        } else {

          setStatus(
            "Voice input had a problem (" +
            event.error +
            ")."
          );

        }

      };


    recognition.onend =
      function () {

        recognizing =
          false;

        els.micBtn.classList.remove(
          "listening"
        );

        if (
          els.statusLine.textContent ===
          "Listening…"
        ) {

          setStatus(
            "",
            1
          );

        }

      };

  }


  function toggleVoiceInput() {

    if (!recognition) return;

    if (recognizing) {

      recognition.stop();

      return;

    }


    try {

      recognition.start();

    } catch (e) {

      setStatus(
        "Couldn't start voice input."
      );

    }

  }


  /* =========================================================
     TYPING INDICATOR
  ========================================================= */

  function showTyping() {

    const row =
      document.createElement("div");

    row.className =
      "bubble-row assistant";

    row.id =
      "typingRow";

    row.innerHTML =
      '<div class="bubble typing">' +

    els.messages.appendChild(

    );

  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  async function handleSend() {

    /*
      Text input should always remain
      enabled, including with attachment.
    */

    els.textInput.disabled =
      false;

    els.textInput.readOnly =
      false;


    const text =
      els.textInput.value.trim();


    /*
      Allow:
      1. Text only
      2. Attachment only
      3. Text + attachment
    */

    if (
      !text &&
      !pendingAttachment
    ) {

      return;

    }


    const conv =
      getCurrent();


    /*
      Keep attachment before clearing it.
    */

    const attachmentForApi =
      pendingAttachment;


    /*
      Create user message.
    */

    const userMsg = {

      role:
        "user",

      text:
        text,

      time:
        Date.now()

    };


    /*
      Add attachment to local message.
    */

    if (
      attachmentForApi
    ) {

      if (
        attachmentForApi.kind ===
        "image"
      ) {

        userMsg.attachment = {

          kind:
            "image",

          name:
            attachmentForApi.name,

          mediaType:
            attachmentForApi.mediaType,

          data:
            attachmentForApi.data

        };

      } else {

        userMsg.attachment = {

          kind:
            attachmentForApi.kind ||
            "file",

          name:
            attachmentForApi.name,

          mediaType:
            attachmentForApi.mediaType ||
            null,

          text:
            attachmentForApi.text ||
            null

        };

      }

    }


    conv.messages.push(
      userMsg
    );


    /*
      Chat title.
    */

    if (
      conv.title ===
      "New chat"
    ) {

      if (text) {

        conv.title =
          text.length > 40
            ? text.slice(0, 40) + "…"
            : text;

      } else if (
        attachmentForApi
      ) {

        conv.title =
          attachmentForApi.name ||
          "Attachment";

      }

    }


    /*
      Clear pending attachment.
    */

    pendingAttachment =
      null;


    /*
      Keep text box enabled.
    */

    els.textInput.disabled =
      false;

    els.textInput.readOnly =
      false;


    showAttachmentPreview();


    /*
      Clear sent text.
    */

    els.textInput.value =
      "";

    autoResize();


    /*
      Disable only send button.
    */

    els.sendBtn.disabled =
      true;


    renderHistory();

    renderMessages();

    saveState();

    showTyping();


    try {

      const result =
        await callAssistant(
          conv,
          attachmentForApi
        );


      hideTyping();


      /*
        Save assistant response.
      */

      conv.messages.push({

        role:
          "assistant",

        text:
          result.reply ||
          "No response received.",

        time:
          Date.now(),

        helplines:
          Array.isArray(
            result.helplines
          )
            ? result.helplines
            : []

      });


      /*
        Backend conversation ID.
      */

      if (
        result.conversationId
      ) {

        conv.conversationId =
          result.conversationId;

      }


      /*
        Provider badge.
      */

      if (
        result.label
      ) {

        els.providerBadge.textContent =
          result.label;

      }


      renderMessages();

      renderHistory();

      saveState();


      /*
        Save attachment metadata.
      */

      if (
        attachmentForApi
      ) {

        try {

          await saveAttachmentToDatabase(

            result.conversationId ||
              conv.conversationId,

            result.userMessageId ||
              result.messageId ||
              null,

            attachmentForApi

          );

        } catch (
          attachmentError
        ) {

          console.error(
            "Attachment database save failed:",
            attachmentError
          );

          setStatus(
            "Message sent, but attachment metadata could not be saved."
          );

        }

      }


    } catch (err) {

      hideTyping();


      conv.messages.push({

        role:
          "error",

        text:
          describeError(err),

        time:
          Date.now()

      });


      renderMessages();

      saveState();


    } finally {

      /*
        Never disable text input.
      */

      els.textInput.disabled =
        false;

      els.textInput.readOnly =
        false;


      els.sendBtn.disabled =
        false;


      try {

        els.textInput.focus();

      } catch (e) {

        // Ignore focus errors.

      }

    }

  }


  /* =========================================================
     ERROR MESSAGE
  ========================================================= */

  function describeError(err) {

    if (
      err &&
      err.serverMessage
    ) {

      return err.serverMessage;

    }

    return (
      "Can't reach the API server. " +
      "Make sure it's running (npm start in the chatbot-api folder)."
    );

  }


  /* =========================================================
     SAVE ATTACHMENT METADATA
  ========================================================= */

  async function saveAttachmentToDatabase(
    conversationId,
    messageId,
    attachment
  ) {

    if (
      !attachment ||
      !conversationId
    ) {

      return;

    }


    let fileSize =
      null;

    let fileType =
      attachment.mediaType ||
      null;


    /*
      IMAGE FILE SIZE
    */

    if (
      attachment.kind === "image" &&
      attachment.data
    ) {

      fileType =
        attachment.mediaType ||
        "image/*";

      const base64 =
        attachment.data
          .split(",")[1] || "";

      fileSize =
        Math.floor(
          base64.length * 0.75
        );

    }


    /*
      TEXT FILE SIZE
    */

    if (
      attachment.kind === "text" &&
      attachment.text
    ) {

      fileType =
        fileType ||
        "text/plain";

      fileSize =
        new Blob([
          attachment.text
        ]).size;

    }


    /*
      UNSUPPORTED FILE
    */

    if (
      attachment.kind ===
      "unsupported"
    ) {

      fileType =
        fileType ||
        "application/octet-stream";

    }


    const response =
      await fetch(
        "http://localhost:3000/api/attachment",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              userId:
                1,

              conversationId:
                Number(
                  conversationId
                ),

              messageId:
                messageId
                  ? Number(messageId)
                  : null,

              fileName:
                attachment.name ||
                "attachment",

              fileType:
                fileType,

              fileSize:
                fileSize,

              filePath:
                null

            })

        }
      );


    let data =
      null;


    try {

      data =
        await response.json();

    } catch (e) {

      data =
        null;

    }


    if (
      !response.ok ||
      !data ||
      !data.success
    ) {

      throw new Error(
        (
          data &&
          data.error
        ) ||
        "Failed to save attachment."
      );

    }


    return data;

  }


  /* =========================================================
     CALL BACKEND
  ========================================================= */

  async function callAssistant(
    conv,
    attachment
  ) {

    const history =
      conv.messages
        .slice(-20)
        .filter(
          function (m) {

            return (
              m.role === "user" ||
              m.role === "assistant"
            );

          }
        )
        .map(
          function (m) {

            return {

              role:
                m.role,

              text:
                m.text || ""

            };

          }
        );


    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              conversationId:
                conv.conversationId ||
                null,

              messages:
                history,

              attachment:
                attachment || null

            })

        }
      );


    let data =
      null;


    try {

      data =
        await response.json();

    } catch (e) {

      data =
        null;

    }


    if (
      !response.ok
    ) {

      const err =
        new Error(
          "server-error"
        );

      err.serverMessage =

        (
          data &&
          (
            data.error ||
            data.reply
          )
        ) ||

        (
          "Server responded with " +
          response.status +
          "."
        );

      throw err;

    }


    if (!data) {

      const err =
        new Error(
          "empty-response"
        );

      err.serverMessage =
        "Server returned an empty response.";

      throw err;

    }


    return data;

  }


  /* =========================================================
     SIDEBAR
  ========================================================= */

  function closeSidebarOnMobile() {

    els.sidebar.classList.remove(
      "open"
    );

    els.sidebarBackdrop.classList.remove(
      "show"
    );

  }


  /* =========================================================
     EVENT BINDINGS
  ========================================================= */

  function bindEvents() {

    /*
      New chat
    */

    els.newChatBtn.addEventListener(
      "click",
      function () {

        createConversation();

        renderHistory();

        renderMessages();

        els.textInput.focus();

        closeSidebarOnMobile();

      }
    );


    /*
      History
    */

    els.historyList.addEventListener(
      "click",
      function (e) {

        const delBtn =
          e.target.closest(
            ".history-delete"
          );


        if (delBtn) {

          e.stopPropagation();

          deleteConversation(
            delBtn.dataset.id
          );

          return;

        }


        const item =
          e.target.closest(
            ".history-item"
          );


        if (item) {

          state.currentId =
            item.dataset.id;

          saveState();

          renderHistory();

          renderMessages();

          closeSidebarOnMobile();

        }

      }
    );


    /*
      Clear history
    */

    els.clearHistoryBtn.addEventListener(
      "click",
      function () {

        if (
          confirm(
            "Clear all conversation history? This can't be undone."
          )
        ) {

          state.conversations =
            {};

          state.order =
            [];

          createConversation();

          renderHistory();

          renderMessages();

        }

      }
    );


    /*
      Attachment
    */

    els.attachBtn.addEventListener(
      "click",
      function () {

        els.fileInput.click();

      }
    );


    els.fileInput.addEventListener(
      "change",
      handleFileSelect
    );


    /*
      Send form
    */

    els.inputForm.addEventListener(
      "submit",
      function (e) {

        e.preventDefault();

        handleSend();

      }
    );


    /*
      Enter = send
      Shift+Enter = new line
    */

    els.textInput.addEventListener(
      "keydown",
      function (e) {

        if (
          e.key === "Enter" &&
          !e.shiftKey
        ) {

          e.preventDefault();

          handleSend();

        }

      }
    );


    els.textInput.addEventListener(
      "input",
      autoResize
    );


    /*
      Mic
    */

    els.micBtn.addEventListener(
      "click",
      toggleVoiceInput
    );


    /*
      Mobile sidebar
    */

    els.sidebarToggle.addEventListener(
      "click",
      function () {

        els.sidebar.classList.toggle(
          "open"
        );

        els.sidebarBackdrop.classList.toggle(
          "show"
        );

      }
    );


    els.sidebarBackdrop.addEventListener(
      "click",
      closeSidebarOnMobile
    );

  }

})();
</script>

</body>
</html>
